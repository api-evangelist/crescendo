name: Crescendo
description: >-
  Crescendo is an AI-native customer experience (CX) platform that unifies AI
  agents for chat, voice, email, and messaging with quality assurance, workforce
  management, and business insights. The Crescendo Platform API (OpenAPI 3.1) is
  a tenant-scoped HTTP API for provisioning tenant configuration and documents,
  exporting assistant and voice-of-customer (VOC) conversations for reporting
  with cursor pagination, uploading audio recordings for asynchronous VOC
  processing, and driving assistants through a hosted Model Context Protocol
  (MCP) bots server over Streamable HTTP. Authentication is a tenant-scoped
  bearer API key. Crescendo is backed by General Catalyst and Trinity Ventures.
